<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game Store - Clase 2 y 3</title>
    <!--CSS DE BOOTSTRAP 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark  text-white p-4">
    <div class="container">
        <!-- ENCABEZADO-->
         <header class="text-center mb-4">
            <h1 class="display-5 fw-bold">Retro Game Store</h1>
            <p class="text-scondary">Catálogo interactivo en tiempo real</p>
         </header>
         <!-- Panel de control y busqueda-->
          <div class="row mb-4 align-items-center">
            <div class="col-md-5 mb-2 mb-md-0">
                <input type="text" id="input-buscar" class="form-control" placeholder="Buscar juego por título...">
            </div>
            <div class="col-md-4 mb-2 mb-md-0 text-center">
                <!--Botón para  llamar la PokeAPI-->
                <button class="btn btn-warning fw-bold" onclick="cargarEdicionesPokemon()"> PokéAPI</button>
            </div>
            <div class="col-md-3 text-md-end text-center">
                <h4 id="texto-caja" class="badge bg-success fs-5">Caja:$500</h4>
            </div>
          </div>
          <hr class="border-secondary mb-4">
          <!-- Contenedor donde javascript dibujará las tarjetas-->
           <div id="contenedor-juegos" class="row"></div>
    </div>
    <!-- conexión con el archivo javascript-->
    <script src="app.js"></script>
</body>
</html>
